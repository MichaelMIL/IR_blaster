<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>IR Remote</title>
</head>
<body class="remote">
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v16h10V4H7zm2 2h6v3H9V6zm0 5h2v2H9v-2zm4 0h2v2h-2v-2zm-4 4h2v2H9v-2zm4 0h2v2h-2v-2z"/></svg>
    <span>IR Remote</span>
  </div>
  <a class="conn" href="/advanced" title="Device connection"><span class="dot" id="dot"></span><span id="connText">connecting…</span></a>
</header>
<nav class="tabs">
  <a href="/">Remote</a>
  <a href="/timers">Timers</a>
  <a href="/history">History</a>
  <a href="/advanced">Advanced</a>
</nav>
<main>
<div>
  <div class="card acard">
    <div class="acdisplay" id="acdisplay">
      <div class="acmode" id="acModeIcon"></div>
      <div class="actemp"><span id="acTemp">--</span><span class="deg">°C</span></div>
      <div class="acsub">
        <span id="acModeText">—</span>
        <span class="fan" id="acFanBars" title="fan"><i></i><i></i><i></i></span>
        <span id="acFanText"></span>
      </div>
      <div class="acstate" id="acPowerText">off</div>
    </div>
    <div class="acrow temprow">
      <button class="round big" id="tempDown" aria-label="colder">−</button>
      <button class="power" id="acPower" aria-label="power">
        <svg viewBox="0 0 24 24" width="30" height="30"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
      </button>
      <button class="round big" id="tempUp" aria-label="warmer">+</button>
    </div>
    <div class="label">Mode</div>
    <div class="seg" id="modeSeg">
      <button data-mode="auto"><span class="ico"></span><small>Auto</small></button>
      <button data-mode="cool"><span class="ico"></span><small>Cool</small></button>
      <button data-mode="dry"><span class="ico"></span><small>Dry</small></button>
      <button data-mode="fan"><span class="ico"></span><small>Fan</small></button>
      <button data-mode="heat"><span class="ico"></span><small>Heat</small></button>
    </div>
    <div class="label">Fan</div>
    <div class="seg" id="fanSeg">
      <button data-fan="auto"><small>Auto</small></button>
      <button data-fan="low"><span class="bars b1"><i></i><i></i><i></i></span><small>Low</small></button>
      <button data-fan="med"><span class="bars b2"><i></i><i></i><i></i></span><small>Med</small></button>
      <button data-fan="high"><span class="bars b3"><i></i><i></i><i></i></span><small>High</small></button>
    </div>
    <div class="label">Quick temperature</div>
    <div class="chips" id="tempChips"></div>
    <div class="label">Sleep timer <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">turn the AC off in…</span></div>
    <div class="chips" id="sleepChips"></div>
    <div id="timerStrip"></div>
    <div class="msg" id="acMsg"></div>
  </div>
</div>
<div class="side">
  <h2>Scenes</h2>
  <div class="grid" id="sceneGrid"></div>
  <div class="card slim">
    <div class="row">
      <input id="sceneName" placeholder="Scene name (e.g. Night)" maxlength="24">
      <input id="sceneIcon" placeholder="icon" maxlength="2" style="width:64px;flex:none;text-align:center">
      <button class="pri" onclick="saveScene()">Save current AC state</button>
    </div>
    <p class="hint">A scene stores the AC state shown on the left. Long-press (or right-click) a scene to delete it.</p>
  </div>
  <h2>Buttons <span class="hint">configured on the blaster</span></h2>
  <div class="grid" id="btnGrid"><div class="empty">loading…</div></div>
</div>
</main>
<div class="toast" id="toast" hidden></div>
<script src="common.js"></script>
<script src="remote.js"></script>
</body>
</html>
