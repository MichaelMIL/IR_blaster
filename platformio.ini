; Tuya IR blaster on a CB3S module (Beken BK7231N)
; Platform: LibreTiny  https://docs.libretiny.eu

[env:cb3s]
platform = libretiny
board = cb3s
framework = arduino

monitor_speed = 115200
monitor_port = ${env.upload_port}

; Flash over serial (UART1 = TX1/RX1 pads on the CB3S).
; Set upload_port to your USB-UART adapter, e.g. /dev/cu.usbserial-0001
upload_protocol = uart
upload_speed = 115200
; upload_port = /dev/cu.usbserial-0001

build_flags =
    ; Serial + logger on UART1 (TX1/RX1 pads) - same port used for flashing,
    ; so ltchiptool can auto-reboot the chip into the bootloader.
    -D LT_UART_DEFAULT_PORT=1
    -D IR_TX_PIN=26
    -D IR_RX_PIN=255      ; unknown: find it with `rx scan`
    -D STATUS_LED_PIN=8   ; blue LED
    -D IR_CARRIER_HZ=38000

; Over-the-air upload to a running device:
;   pio run -e cb3s_ota -t upload --upload-port ir-blaster.local   (or the IP)
[env:cb3s_ota]
extends = env:cb3s
upload_protocol = custom
upload_command = curl -sS -f -F "file=@$SOURCE" "http://$UPLOAD_PORT/update"
